    <p class="sidebar-footer">© 2024 St. John Bosco Document Request System</p>

  <div class="dashboard-shell">
    <main class="dashboard-main">
      <div class="dashboard-main__inner">
        <h1 class="dashboard-main__heading">Document Requests</h1>
        <p class="dashboard-main__lead">Review and process student document requests.</p>
        <section class="dashboard-panel">
          <section class="dashboard-panel">
            <h2>New Document Request</h2>
          
            <form class="request-form">
          
              <div class="form-group">
                <label for="student-id">Student ID</label>
                <input type="text" id="student-id" name="student-id" placeholder="Enter Student ID">
              </div>
          
              <div class="form-group">
                <label for="student-name">Student Name</label>
                <input type="text" id="student-name" name="student-name" placeholder="Enter Student Name">
              </div>
          
              <div class="form-group">
                <label for="document-type">Document Type</label>
                <select id="document-type" name="document-type">
                  <option value="">Select Document</option>
                  <option value="tor">Transcript of Records</option>
                  <option value="coe">Certificate of Enrollment</option>
                  <option value="good-moral">Good Moral Certificate</option>
                  <option value="certification">Other Certification</option>
                </select>
              </div>
          
              <div class="form-group">
                <label for="purpose">Purpose</label>
                <textarea id="purpose" name="purpose" placeholder="Enter purpose of request"></textarea>
              </div>
          
              <div class="form-group">
                <label for="request-date">Request Date</label>
                <input type="date" id="request-date" name="request-date">
              </div>
          
              <button type="submit" class="request-button">
                Submit Request
              </button>
          
            </form>
          </section>
        </section>
      </div>
    </main>
  </div>
